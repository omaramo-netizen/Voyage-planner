<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon voyage</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f4f6fa; color: #222; }
  h1 { font-size: 22px; }
  .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin: 5px 0; border: 1px solid #ccd; border-radius: 8px; font-size: 16px; }
  button { width: 100%; padding: 12px; background: #2f6fed; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 6px; }
  .act { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .act input[type=checkbox] { width: 22px; height: 22px; margin: 0; }
  .act .info { flex: 1; }
  .done { text-decoration: line-through; color: #999; }
  .del { width: auto; background: #e5484d; padding: 6px 10px; margin: 0; }
  .reste { font-size: 20px; font-weight: bold; }
  .neg { color: #e5484d; }
</style>
</head>
<body>
<h1>Mon planificateur de voyage</h1>

<div class="card">
  <input id="dest" placeholder="Destination">
  <input id="depart" type="date">
  <input id="retour" type="date">
  <input id="budget" type="number" placeholder="Budget total">
</div>

<div class="card">
  <strong>Ajouter une activité</strong>
  <input id="nom" placeholder="Nom de l'activité">
  <input id="jour" type="date">
  <input id="prix" type="number" placeholder="Prix">
  <button onclick="ajouter()">Ajouter</button>
</div>

<div class="card">
  <div id="liste"></div>
</div>

<div class="card">
  <div>Dépensé : <span id="depense">0</span></div>
  <div>Il reste : <span id="reste" class="reste">0</span></div>
</div>

<script>
  let data = JSON.parse(localStorage.getItem('voyage') || '{"dest":"","depart":"","retour":"","budget":0,"acts":[]}');

  function sauver() { localStorage.setItem('voyage', JSON.stringify(data)); }

  function ajouter() {
    const nom = document.getElementById('nom').value.trim();
    if (!nom) return;
    data.acts.push({
      nom: nom,
      jour: document.getElementById('jour').value,
      prix: parseFloat(document.getElementById('prix').value) || 0,
      fait: false
    });
    document.getElementById('nom').value = '';
    document.getElementById('prix').value = '';
    afficher();
  }

  function cocher(i) { data.acts[i].fait = !data.acts[i].fait; afficher(); }
  function supprimer(i) { data.acts.splice(i, 1); afficher(); }

  function afficher() {
    data.dest = document.getElementById('dest').value;
    data.depart = document.getElementById('depart').value;
    data.retour = document.getElementById('retour').value;
    data.budget = parseFloat(document.getElementById('budget').value) || 0;

    const triees = data.acts.map((a, i) => ({ a: a, i: i })).sort((x, y) => (x.a.jour || '').localeCompare(y.a.jour || ''));
    document.getElementById('liste').innerHTML = triees.map(o =>
      '<div class="act">' +
      '<input type="checkbox" ' + (o.a.fait ? 'checked' : '') + ' onchange="cocher(' + o.i + ')">' +
      '<div class="info ' + (o.a.fait ? 'done' : '') + '">' + o.a.nom + '<br><small>' + (o.a.jour || 'sans date') + ' - ' + o.a.prix + '</small></div>' +
      '<button class="del" onclick="supprimer(' + o.i + ')">X</button></div>'
    ).join('');

    const total = data.acts.reduce((s, a) => s + a.prix, 0);
    const reste = data.budget - total;
    document.getElementById('depense').textContent = total;
    const r = document.getElementById('reste');
    r.textContent = reste;
    r.className = 'reste' + (reste < 0 ? ' neg' : '');
    sauver();
  }

  document.getElementById('dest').value = data.dest;
  document.getElementById('depart').value = data.depart;
  document.getElementById('retour').value = data.retour;
  document.getElementById('budget').value = data.budget || '';
  ['dest','depart','retour','budget'].forEach(id => document.getElementById(id).addEventListener('input', afficher));
  afficher();
</script>
</body>
</html>
